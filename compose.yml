services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: social
      MYSQL_USER: social
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-social}
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "content-published-v1", "--partitions", "3", "--replication-factor", "1"]

  cassandra:
    image: cassandra:5.0.9
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./infra/cassandra/schema.cql:/schema.cql:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30

  cassandra-init:
    image: cassandra:5.0.9
    depends_on:
      cassandra: { condition: service_healthy }
    volumes: ["./infra/cassandra/schema.cql:/schema.cql:ro"]
    command: ["cqlsh", "cassandra", "-f", "/schema.cql"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  elasticsearch-init:
    image: curlimages/curl:8.12.1
    depends_on:
      elasticsearch: { condition: service_healthy }
    volumes: ["./infra/elasticsearch/content-index.json:/content-index.json:ro"]
    command: ["-fsS", "-X", "PUT", "http://elasticsearch:9200/content-v1", "-H", "Content-Type: application/json", "--data-binary", "@/content-index.json"]

volumes:
  mysql-data:
  cassandra-data:
  elasticsearch-data:

