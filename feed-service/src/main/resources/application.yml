server.port: 8082
spring:
  application.name: feed-service
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: datacenter1
    keyspace-name: text_social
    schema-action: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app:
  jwt.secret: ${JWT_SECRET:local-learning-secret-change-me-12345678901234567890}
  internal-api-key: ${INTERNAL_API_KEY:local-internal-key}
  social-url: ${SOCIAL_URL:http://localhost:8081}
  kafka:
    content-topic: content-published-v1
    listener-enabled: ${KAFKA_LISTENER_ENABLED:false}
management.endpoints.web.exposure.include: health,info

