server:
  port: 8081
spring:
  application.name: social-service
  datasource:
    # Docker Compose exposes MySQL on host port 3307 (container port remains 3306).
    url: ${MYSQL_URL:jdbc:mysql://localhost:8916/social}
    username: ${MYSQL_USER:social}
    password: ${MYSQL_PASSWORD:social}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
app:
  jwt:
    secret: ${JWT_SECRET:local-learning-secret-change-me-12345678901234567890}
    ttl-seconds: 3600
  internal-api-key: ${INTERNAL_API_KEY:local-internal-key}
  celebrity-threshold: ${CELEBRITY_THRESHOLD:100}
management.endpoints.web.exposure.include: health,info
logging.pattern.console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n"
