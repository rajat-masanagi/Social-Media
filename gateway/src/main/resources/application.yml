server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: social
              uri: ${SOCIAL_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/me,/api/users/**,/api/posts/**
            - id: feed
              uri: ${FEED_URL:http://localhost:8082}
              predicates:
                - Path=/api/feed/**
            - id: search
              uri: ${SEARCH_URL:http://localhost:8083}
              predicates:
                - Path=/api/search/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${FRONTEND_ORIGIN:http://localhost:5173}
                allowedMethods: [GET, POST, DELETE, OPTIONS]
                allowedHeaders: ['*']
app:
  jwt:
    secret: ${JWT_SECRET:local-learning-secret-change-me-12345678901234567890}
management:
  endpoints.web.exposure.include: health,info

